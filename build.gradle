plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = "Ladysnake Mods"
		url = 'https://maven.ladysnake.org/releases'
	}
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		// forRepositories(fg.repository) // Uncomment when using ForgeGradle
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven { url = "https://mvn.devos.one/snapshots" }
	maven { url = "https://mvn.devos.one/releases/" }
	maven { url = "https://maven.tterrag.com/" }
	maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
	maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
	maven { url = "https://maven.createmod.net" }

	maven {
		// location of the maven that hosts JEI files before January 2023
		name = "Progwml6's maven"
		url = "https://dvs1.progwml6.com/files/maven/"
	}
	maven {
		// location of the maven that hosts JEI files since January 2023
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
	maven {
		// location of a maven mirror for JEI files, as a fallback
		name = "ModMaven"
		url = "https://modmaven.dev"
	}
	maven {
		name = "Sleeping Town"
		url = "https://repo.sleeping.town/"
	}
	maven { url "https://maven.ryanliptak.com/" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// DEPENDENCIES

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// CARDINAL COMPONENTS API
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"

	// Cloth config
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Mod Menu
	modImplementation("com.terraformersmc:modmenu:${modmenu}")

	// Create
	modImplementation("com.simibubi.create:create-fabric-$minecraft_version:$create_version")

	// JEI
	modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")

	// EMI
	modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"

	// AppleSkin
	modCompileOnly("squeek.appleskin:appleskin-fabric:${apple_skin}") {
		transitive = false
	}

	// Brewin And Chewin Fabric
	modImplementation "maven.modrinth:e4G0uSdm:ZieRTW8y"

	// Tough As Nails
	modImplementation "maven.modrinth:ge1sOdFH:VaFrDMPi"

	// Farmer's Delight Refabricated
	modImplementation "maven.modrinth:7vxePowz:7H1g1o5h"

	// Glitch Core
	modImplementation "maven.modrinth:s3dmwKy5:25HLOiOl"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

loom {
	accessWidenerPath = file("src/main/resources/thirst.classtweaker")
}
