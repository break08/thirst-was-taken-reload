plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = "Ladysnake Mods"
		url = 'https://maven.ladysnake.org/releases'
	}
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		// forRepositories(fg.repository) // Uncomment when using ForgeGradle
		filter {
			includeGroup "maven.modrinth"
		}
	}


	maven {
		// location of the maven that hosts JEI files before January 2023
		name = "Progwml6's maven"
		url = "https://dvs1.progwml6.com/files/maven/"
	}
	maven {
		// location of the maven that hosts JEI files since January 2023
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
	maven {
		// location of a maven mirror for JEI files, as a fallback
		name = "ModMaven"
		url = "https://modmaven.dev"
	}
	maven {
		name = "Sleeping Town"
		url = "https://repo.sleeping.town/"
	}
	maven { url "https://maven.ryanliptak.com/" }
	maven { url = "https://maven.greenhouse.lgbt/releases" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// DEPENDENCIES

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// CARDINAL COMPONENTS API
	implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	implementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"

	// Cloth config
	implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Mod Menu
	implementation("com.terraformersmc:modmenu:${modmenu}")

	// AppleSkin
	implementation("squeek.appleskin:appleskin-fabric:${apple_skin}") {
		transitive = false
	}

	// Tough As Nails
	implementation "maven.modrinth:ge1sOdFH:bZ9oibj4"

	// Farmer's Delight Refabricated
	implementation "maven.modrinth:7vxePowz:J6sAZl6u"

	// Glitch Core
	implementation "maven.modrinth:s3dmwKy5:SDUCBYRU"


	runtimeOnly "net.jodah:typetools:0.6.3"

	runtimeOnly "com.electronwill.night-config:core:3.6.7"
	runtimeOnly "com.electronwill.night-config:toml:3.6.7"

	// Everything is unstable like somebody's SMP

}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

loom {
	accessWidenerPath = file("src/main/resources/thirst.accesswidener")
}
